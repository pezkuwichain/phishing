name: PR
on: [pull_request]

permissions: {}

jobs:
  pr:
    # continue-on-error was inherited from upstream and meant these four steps
    # could never turn a pull request red. Two of them were failing — build since
    # 2026-09-13 and deno for far longer — and nobody saw it, because the job
    # reported success either way. A check that cannot fail is not a check.
    strategy:
      matrix:
        step: ['lint', 'test', 'build', 'deno']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      YARN_ENABLE_SCRIPTS: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 'lts/*'
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: vx.x.x
    - name: ${{ matrix.step }}
      if: always()
      run: |
        yarn install --immutable
        yarn ${{ matrix.step }}
